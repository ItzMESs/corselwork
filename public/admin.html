<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORSEL Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fff; --fg:#000; --muted:#6b6b6b; --red:#c51811; --line:#e6e6e6; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg)}
  body{font-family:"Unbounded",Arial,sans-serif;font-size:11px;line-height:1.5}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea{font:inherit;font-size:11px;color:var(--fg);background:var(--bg);border:1.5px solid var(--fg);padding:10px;width:100%}
  textarea{resize:vertical}

  /* Top bar: brand name left, logo right */
  header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1.5px solid var(--fg);position:sticky;top:0;background:var(--bg);z-index:10}
  header .brand{font-size:22px;font-weight:800;letter-spacing:.06em;flex:1;white-space:nowrap}
  header img{width:48px;height:48px;object-fit:contain}
  header a{font-size:9px;font-weight:600;color:var(--muted);text-decoration:none}

  /* Sidebar + content */
  .layout{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 78px)}
  .side{border-right:1.5px solid var(--fg)}
  nav{display:flex;flex-direction:column;position:sticky;top:78px}
  nav button{text-align:left;font-size:12px;font-weight:600;padding:14px 20px;border-bottom:1px solid var(--line);color:var(--muted);display:flex;align-items:center;gap:6px}
  nav button:hover{background:#f6f6f6;color:var(--fg)}
  nav button.on{background:var(--fg);color:var(--bg)}
  nav b{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:8px;margin-left:auto}
  @media (max-width:800px){
    header{padding:10px 16px}
    header .brand{font-size:16px}
    header img{width:36px;height:36px}
    .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
    .side{border-right:0;border-bottom:1.5px solid var(--fg)}
    nav{flex-direction:row;overflow-x:auto;position:static}
    nav button{border-bottom:0;padding:12px 14px;white-space:nowrap;font-size:11px}
    nav b{margin-left:4px}
  }

  /* Dashboard */
  .dash h1{font-size:14px;font-weight:800;margin-bottom:16px}
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
  @media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}
  @media (max-width:500px){.tiles .tile{padding:12px}.tiles .tile b{font-size:15px}}
  .tile{border:1.5px solid var(--fg);padding:16px;text-align:left;display:block;width:100%}
  .tile:hover{background:#f6f6f6}
  .tile span{display:block;font-size:9px;color:var(--muted);font-weight:600}
  .tile b{display:block;font-size:20px;font-weight:800;margin:6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile small{font-size:9px;color:var(--muted)}
  .tile.alert b{color:var(--red)}
  .panel{border:1.5px solid var(--fg);padding:16px;margin-bottom:20px}
  .panel h2{font-size:11px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
  .panel h2 small{font-weight:600;color:var(--muted);font-size:9px}
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:9px;padding:6px 8px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
  .chart details{margin-top:8px;font-size:9px;color:var(--muted)}
  .chart table{width:100%;border-collapse:collapse;margin-top:6px}
  .chart td{padding:2px 4px;border-bottom:1px solid var(--line)}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  @media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
  .cols .panel{margin-bottom:0}
  .li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:10px}
  .li:last-child{border-bottom:0}
  .li .th{width:36px;height:36px;flex:none;display:grid;place-items:center}
  .li .th img,.li .th svg{width:100%;height:100%;object-fit:contain}
  .li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li .bar{height:4px;background:var(--fg);border-radius:0 4px 4px 0;margin-top:4px}
  .li .num{font-weight:800;white-space:nowrap}
  .li .num.red{color:var(--red)}
  .li.click{cursor:pointer}
  .li.click:hover{background:#f6f6f6}
  .pill{font-size:8px;font-weight:800;padding:2px 6px;border:1.5px solid currentColor;white-space:nowrap}
  .pill.new{color:var(--red)}
  .pill.paid{color:var(--fg)}
  .pill.shipped,.pill.cancelled{color:var(--muted)}

  .logout{font-size:9px;font-weight:600;color:var(--muted);margin-left:12px}
  .login{max-width:300px;margin:60px auto;display:grid;gap:8px}
  [hidden]{display:none !important}
  .btn:disabled{opacity:.6}
  main{padding:24px 24px 60px;max-width:1100px;width:100%}
  @media (max-width:800px){main{padding:16px 16px 60px}}

  /* Products: same grid feel as the shop */
  .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 10px}
  @media (max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .card{text-align:center;font-size:9px;cursor:pointer}
  .card .pic{aspect-ratio:1/1;display:grid;place-items:center;position:relative;border:1.5px solid transparent}
  .card:hover .pic{border-color:var(--fg)}
  .card .pic svg,.card .pic img{width:80%;height:80%;object-fit:contain}
  .card.sold .pic svg,.card.sold .pic img{filter:blur(3px);opacity:.8}
  .card.sold .pic::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;aspect-ratio:2000/830;background:url(soldout.webp) center/contain no-repeat;mix-blend-mode:multiply}
  .card .nm{font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .pr{color:var(--muted)}
  .add .pic{border:1.5px dashed var(--fg);font-size:28px;font-weight:400}

  /* Editor */
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20;overflow:auto;padding:24px 16px}
  .shade.open{display:block}
  .box{background:var(--bg);max-width:420px;margin:0 auto;padding:20px;border:1.5px solid var(--fg)}
  .box h2{font-size:12px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between}
  .photo{width:200px;max-width:100%;margin-left:auto;margin-right:auto;aspect-ratio:1/1;border:1.5px dashed var(--fg);display:grid;place-items:center;cursor:pointer;margin-bottom:12px;color:var(--muted);font-size:10px;text-align:center}
  .photo svg,.photo img{width:80%;height:80%;object-fit:contain}
  .gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:6px}
  .gi{position:relative;aspect-ratio:1/1;border:1.5px solid var(--line);display:grid;place-items:center}
  .gi img{width:86%;height:70%;object-fit:contain;margin-top:-14px}
  .gi .cover{position:absolute;top:0;left:0;background:var(--fg);color:var(--bg);font-size:7px;font-weight:800;padding:2px 5px}
  .gi .gb{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;border-top:1px solid var(--line)}
  .gi .gb button{flex:1;height:22px;font-size:12px;line-height:1}
  .gi .gb button:disabled{opacity:.2;cursor:default}
  .gi .gb button[data-rm]{color:var(--red);font-size:10px}
  .addimg{border:1.5px dashed var(--fg);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .addimg small{font-size:8px;font-weight:600}
  label.t{display:block;font-size:9px;font-weight:600;margin:10px 0 4px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .check{display:flex;gap:8px;align-items:center;margin:14px 0;font-size:10px;cursor:pointer}
  .check input{width:18px;height:18px;accent-color:var(--red)}
  .btns{display:flex;gap:8px}
  .btn{flex:1;height:42px;font-size:10px;font-weight:800;border:1.5px solid var(--fg)}
  .btn.dark{background:var(--fg);color:var(--bg)}
  .btn.red{flex:0 0 auto;padding:0 14px;border-color:var(--red);color:var(--red)}

  /* Orders */
  .order{border:1.5px solid var(--fg);padding:14px;margin-bottom:10px;font-size:10px}
  .order.done{border-color:var(--line);color:var(--muted)}
  .order .who{font-weight:600;font-size:11px}
  .order .who a{color:inherit}
  .order ul{list-style:none;margin:8px 0;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .order li{display:flex;justify-content:space-between}
  .order .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .order .foot b{font-size:12px}
  .order .foot button{padding:7px 12px;font-size:9px;font-weight:800;border:1.5px solid var(--fg)}
  .order.done .foot button.ok{background:none}
  .order .foot button.ok{background:var(--fg);color:var(--bg)}
  .order .foot .x{border-color:var(--red);color:var(--red)}
  .cform{display:grid;grid-template-columns:1fr 80px 100px;gap:8px;max-width:480px;margin:0 auto 16px}
  .cform input{text-transform:uppercase}
  .crow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;max-width:480px;margin:0 auto;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}
  .crow b{font-weight:800;letter-spacing:.04em}
  .crow span{color:var(--red);font-weight:600}
  .crow button{padding:6px 10px;font-size:9px;font-weight:800;border:1.5px solid var(--fg)}
  .crow button.x{border-color:var(--red);color:var(--red)}
  .crow.off{color:var(--muted)}
  .crow.off span{color:var(--muted)}
  .stockbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
  .stockbox label{display:grid;gap:2px;font-size:9px;font-weight:600}
  .stockbox input{padding:7px}
  .hint{font-size:8px;color:var(--muted);margin-top:4px}
  .order .otop{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .order .otop span{flex:1;color:var(--muted);font-size:9px}
  .order select{font:inherit;font-size:9px;font-weight:700;padding:6px;border:1.5px solid var(--fg);background:var(--bg);color:var(--fg)}
  .order .kv{display:flex;gap:10px;font-size:10px;padding:2px 0}
  .order .kv span:first-child{color:var(--muted);min-width:70px}
  .order .kv a{color:inherit}
  .order.st-new{border-color:var(--red)}
  .order.st-paid{border-color:var(--fg)}
  .order.st-shipped,.order.st-cancelled{border-color:var(--line);color:var(--muted)}
  .order.st-cancelled ul{text-decoration:line-through}
  .settings{border:1.5px solid var(--fg);max-width:420px}
  .order .fee{display:flex;gap:8px;align-items:center;font-size:10px;margin-bottom:10px}
  .order .fee span{color:var(--muted);flex:1}
  .order .fee input{width:120px;padding:6px}
  .order .fee button{padding:6px 10px;font-size:9px;font-weight:800;border:1.5px solid var(--fg)}
  .anote{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
  .anote textarea{flex:1;font-size:10px;padding:8px;background:#fffbe6;border:1.5px solid #e8d48a;resize:vertical}
  .anote button{padding:7px 10px;font-size:9px;font-weight:800;border:1.5px solid var(--fg)}
  .ranges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
  .ranges button{padding:8px 12px;border:1.5px solid var(--fg);font-size:10px;font-weight:700}
  .ranges button.on{background:var(--fg);color:var(--bg)}
  .ranges .custom{display:flex;align-items:center;gap:6px;margin-left:auto;padding:4px;border:1.5px solid transparent}
  .ranges .custom.on{border-color:var(--fg)}
  .ranges input[type=date]{width:auto;padding:6px;font-size:10px}
  @media (max-width:800px){.ranges .custom{margin-left:0;width:100%}.ranges .custom input{flex:1}}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:180px}
  .toolbar select{font:inherit;font-size:10px;padding:8px;border:1.5px solid var(--fg);background:var(--bg)}
  .ctable{width:100%;border-collapse:collapse;font-size:10px}
  .ctable th{text-align:left;font-size:9px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1.5px solid var(--fg)}
  .ctable td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .ctable td small{display:block;color:var(--muted);font-size:8px}
  .ctable td a{color:inherit}
  .ctable .red{color:var(--red);font-weight:700}
  .ctable tr.off td{color:var(--muted)}
  .ctable .act{white-space:nowrap;text-align:right}
  .ctable .act button{padding:5px 9px;font-size:9px;font-weight:800;border:1.5px solid var(--fg);margin-left:4px}
  .ctable .act button.x{border-color:var(--red);color:var(--red)}
  .ctable tr.click{cursor:pointer}
  .ctable tr.click:hover td{background:#f6f6f6}
  .ctable tr.sub td{background:#fafafa;padding:4px 12px}
  @media (max-width:800px){
    .ctable thead{display:none}
    .ctable tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);padding:6px 0}
    .ctable td{border:0;padding:3px 6px}
    .ctable tr.sub{display:block}
  }
  .empty{padding:60px 0;text-align:center;color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;font-size:9px;font-weight:600;transition:.25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .toast.err{background:var(--red)}
</style>
</head>
<body>

<header>
  <div class="brand">КОРСЕЛ.МН</div>
  <a href="/" target="_blank">Сайт үзэх ↗</a>
  <button id="logout" class="logout" hidden>Гарах</button>
  <img src="logo.png" alt="Logo">
</header>

<form class="login" id="login" hidden>
  <label class="t">Админ нууц үг</label>
  <input type="password" name="password" required autocomplete="current-password">
  <button class="btn dark">Нэвтрэх</button>
</form>

<div id="panel" class="layout" hidden>
  <aside class="side">
    <nav>
      <button data-tab="dashboard" class="on">Dashboard</button>
      <button data-tab="products">Бараа</button>
      <button data-tab="orders">Захиалга<span id="badge"></span></button>
      <button data-tab="customers">Үйлчлүүлэгч</button>
      <button data-tab="coupons">Купон</button>
      <button data-tab="settings">Тохиргоо</button>
    </nav>
  </aside>
  <main id="app"></main>
</div>

<div class="shade" id="shade"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
let products = [], orders = [], coupons = [];
let tab = "dashboard";
const $app = document.getElementById("app");
const shade = document.getElementById("shade");

function toast(msg, err){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
// Runs an API call; on 401 drops back to the login screen.
async function call(path, opts){
  try { return await api(path, opts); }
  catch (e) { if (e.status === 401) showLogin(); else toast(e.message, true); throw e; }
}

/* ---------- Нэвтрэх ---------- */
function showLogin(){
  document.getElementById("panel").hidden = true;
  document.getElementById("logout").hidden = true;
  document.getElementById("login").hidden = false;
  closeEditor();
}
document.getElementById("login").onsubmit = async e => {
  e.preventDefault();
  try {
    await api("login", { method: "POST", body: { password: e.target.password.value } });
    e.target.reset(); start();
  } catch (err) { toast(err.message, true); }
};
document.getElementById("logout").onclick = async () => { await api("login", { method: "DELETE" }).catch(() => {}); showLogin(); };

/* ---------- Бараа ---------- */
function renderProducts(){
  $app.innerHTML = `<div class="grid">
    <div class="card add" id="new"><div class="pic">+</div><div class="nm">Бараа нэмэх</div></div>
    ${products.map(p => `
      <div class="card${p.soldOut ? " sold" : ""}" data-id="${p.id}">
        <div class="pic">${art(p)}</div>
        <div class="nm">${esc(p.name)}</div>
        <div class="pr">${p.compareAt > p.price ? `<s>${fmt(p.compareAt)}</s> <span style="color:var(--red)">${fmt(p.price)}</span>` : fmt(p.price)}</div>
        <div class="pr">${stockLabel(p)}</div>
      </div>`).join("")}
  </div>`;
  document.getElementById("new").onclick = () => openEditor(null);
  $app.querySelectorAll("[data-id]").forEach(c => c.onclick = () => openEditor(products.find(p => p.id == c.dataset.id)));
}

const sizesOf = p => p.sizes.length ? p.sizes : ["OS"];
function stockLabel(p){
  const tracked = sizesOf(p).filter(s => Number.isInteger(p.stock[s]));
  if (!tracked.length) return "Үлдэгдэл: ∞";
  const sum = tracked.reduce((a, s) => a + p.stock[s], 0);
  return `Үлдэгдэл: ${sum}${tracked.length < sizesOf(p).length ? "+" : ""}`;
}

function openEditor(p){
  const isNew = !p;
  const d = p ? { ...p, stock: { ...p.stock } } : { name:"", nameEn:"", price:"", sizes:["S","M","L","XL"], stock:{}, description:"", sold:false, image:null };
  // Gallery being edited: { keep: ref, url } for stored images, { data, url } for new uploads. First = cover.
  let gal = (d.images || []).map(i => ({ keep: i.ref, url: i.url }));
  shade.innerHTML = `<form class="box" id="f">
    <h2>${isNew ? "Шинэ бараа" : "Бараа засах"}<button type="button" id="x">✕</button></h2>
    <label class="t">Зургууд (эхнийх нь нүүр зураг, 8 хүртэл)</label>
    <div class="gallery" id="gallery"></div>
    <label class="t">Нэр</label><input name="name" required maxlength="120" value="${esc(d.name)}">
    <div class="two">
      <div><label class="t">Үнэ (₮)</label><input name="price" type="number" min="0" required value="${d.price}"></div>
      <div><label class="t">Хуучин үнэ (хямдрал)</label><input name="compareAt" type="number" min="0" value="${d.compareAt ?? ""}" placeholder="Хямдралгүй бол хоосон"></div>
    </div>
    <label class="t">Хэмжээ (таслалаар)</label><input name="sizes" value="${esc(d.sizes.join(", "))}" placeholder="S, M, L">
    <label class="t">Үлдэгдэл (хоосон орхивол хязгааргүй)</label>
    <div class="stockbox" id="stockbox"></div>
    <label class="t">Тайлбар</label><textarea name="description" rows="3">${esc(d.description)}</textarea>
    <label class="check"><input type="checkbox" name="sold" ${d.sold ? "checked" : ""}> Гараар дуусгах (SOLD OUT)</label>
    <div class="hint">Бүх хэмжээний үлдэгдэл 0 болоход автоматаар SOLD OUT болно.</div>
    <div class="btns">
      ${isNew ? "" : `<button type="button" class="btn red" id="del">Устгах</button>`}
      <button class="btn dark">Хадгалах</button>
    </div>
  </form>`;
  shade.classList.add("open");

  const form = document.getElementById("f"), file = document.getElementById("file");
  const sizeList = () => { const l = form.sizes.value.split(",").map(s => s.trim()).filter(Boolean); return l.length ? [...new Set(l)] : ["OS"]; };
  const drawStock = () => {
    // keep what was typed before redrawing
    form.querySelectorAll("[data-stock]").forEach(i => { d.stock[i.dataset.stock] = i.value === "" ? undefined : +i.value; });
    document.getElementById("stockbox").innerHTML = sizeList().map(s =>
      `<label><span>${esc(s)}</span><input type="number" min="0" data-stock="${esc(s)}" value="${Number.isInteger(d.stock[s]) ? d.stock[s] : ""}" placeholder="∞"></label>`).join("");
  };
  drawStock();
  form.sizes.oninput = drawStock;
  document.getElementById("x").onclick = closeEditor;
  const drawGallery = () => {
    const box = document.getElementById("gallery");
    box.innerHTML = gal.map((g, i) => `<div class="gi">
        <img src="${esc(g.url)}" alt="">
        ${i === 0 ? `<span class="cover">Нүүр</span>` : ""}
        <div class="gb">
          <button type="button" data-mv="${i}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="Зүүн тийш">‹</button>
          <button type="button" data-rm="${i}" aria-label="Устгах">✕</button>
          <button type="button" data-mv="${i}" data-d="1" ${i === gal.length - 1 ? "disabled" : ""} aria-label="Баруун тийш">›</button>
        </div></div>`).join("") +
      (gal.length < 8 ? `<button type="button" class="gi addimg" id="addimg">+<small>Зураг нэмэх</small></button>` : "");
    box.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
      const i = +b.dataset.mv, j = i + +b.dataset.d;
      [gal[i], gal[j]] = [gal[j], gal[i]]; drawGallery();
    });
    box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { gal.splice(+b.dataset.rm, 1); drawGallery(); });
    const add = document.getElementById("addimg");
    if (add) add.onclick = () => { file.value = ""; file.click(); };
  };
  drawGallery();
  file.onchange = async () => {
    const picked = [...file.files].slice(0, 8 - gal.length);
    if (!picked.length) return;
    try {
      for (const f of picked) { const data = await shrink(f, 1000); gal.push({ data, url: data }); }
      drawGallery();
    }
    catch { toast("Зургийг уншиж чадсангүй", true); }
  };
  const del = document.getElementById("del");
  if (del) del.onclick = async () => {
    if (!confirm(`"${d.name}" барааг устгах уу?`)) return;
    await call("products?id=" + d.id, { method: "DELETE" });
    products = products.filter(x => x.id !== d.id); closeEditor(); renderProducts(); toast("Устгагдлаа");
  };

  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector(".btn.dark"); btn.disabled = true; btn.textContent = "Хадгалж байна…";
    const payload = {
      name: form.name.value, nameEn: d.nameEn, price: +form.price.value, compareAt: form.compareAt.value,
      sizes: form.sizes.value.split(",").map(s => s.trim()).filter(Boolean),
      description: form.description.value, sold: form.sold.checked,
      images: gal.map(g => g.data ? { data: g.data } : { keep: g.keep }),
      stock: Object.fromEntries([...form.querySelectorAll("[data-stock]")].filter(i => i.value !== "").map(i => [i.dataset.stock, +i.value])),
    };
    try {
      const saved = await call(isNew ? "products" : "products?id=" + d.id, { method: isNew ? "POST" : "PUT", body: payload });
      products = isNew ? [saved, ...products] : products.map(x => x.id === saved.id ? saved : x);
      closeEditor(); renderProducts(); toast("Хадгалагдлаа");
    } catch { btn.disabled = false; btn.textContent = "Хадгалах"; }
  };
}

// Downscale uploads before sending; WebP keeps transparency.
function shrink(file, max){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onerror = rej;
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(im.src);
      res(c.toDataURL("image/webp", 0.85));
    };
    im.src = URL.createObjectURL(file);
  });
}

let custQuery = "", custSort = "spent", custOpen = null;
const digits = s => String(s || "").replace(/\D/g, "");

// One row per phone number; emails and names used with that phone are collected on it.
function customerList(){
  const map = new Map();
  orders.forEach(o => {
    const key = digits(o.phone) || String(o.email).toLowerCase();
    let c = map.get(key);
    if (!c) map.set(key, c = { key, phone: o.phone, names: [], emails: [], orders: [], spent: 0, last: o.createdAt });
    if (o.name && !c.names.includes(o.name)) c.names.push(o.name);
    const em = String(o.email || "").toLowerCase();
    if (em && !c.emails.includes(em)) c.emails.push(em);
    c.orders.push(o);
    if (o.status === "paid" || o.status === "shipped") c.spent += o.total;
    if (new Date(o.createdAt) > new Date(c.last)) c.last = o.createdAt;
  });
  return [...map.values()];
}

        ${custOpen === c.key ? `<tr class="sub"><td colspan="6">${c.orders.map(o => `
          <div class="li"><div class="num" style="width:44px">#${o.id}</div>
            <div class="nm">${o.items.map(i => `${esc(i.name)} (${esc(i.size)}) ×${i.qty}`).join(", ")}</div>
            <span class="pill ${o.status}">${STATUS[o.status]}</span>
            <div class="num" style="min-width:80px;text-align:right">${fmt(o.total)}</div></div>`).join("")}</td></tr>` : ""}`).join("")}</tbody></table>`
      : `<div class="empty">${all.length ? "Олдсонгүй" : "Үйлчлүүлэгч алга"}</div>`}`;

  const cq = document.getElementById("cq");
  cq.oninput = () => { custQuery = cq.value; renderCustomers(); const n = document.getElementById("cq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  document.getElementById("cs").onchange = e => { custSort = e.target.value; renderCustomers(); };
  document.getElementById("copyem").onclick = async () => {
    const emails = [...new Set(list.flatMap(c => c.emails))];
    try { await navigator.clipboard.writeText(emails.join(", ")); toast(`${emails.length} и-мэйл хуулагдлаа`); }
    catch { toast("Хуулж чадсангүй", true); }
  };
  $app.querySelectorAll("tr[data-c]").forEach(r => r.onclick = e => {
    if (e.target.closest("a")) return;
    custOpen = custOpen === r.dataset.c ? null : r.dataset.c; renderCustomers();
  });
}

/* ---------- Dashboard ---------- */
const DAY = 864e5;
const dayKey = d => { d = new Date(d); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const monthKey = d => { d = new Date(d); return `${d.getFullYear()}-${d.getMonth() + 1}`; };
const shortDate = d => `${d.getMonth() + 1}/${d.getDate()}`;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const MONTHS = ["1-р сар","2-р сар","3-р сар","4-р сар","5-р сар","6-р сар","7-р сар","8-р сар","9-р сар","10-р сар","11-р сар","12-р сар"];
let dashRange = { key: "30d", from: "", to: "" };

// [from, to) as dates plus a label for the chosen range
function rangeBounds(){
  const today = startOfDay(new Date()), tomorrow = new Date(today.getTime() + DAY);
  switch (dashRange.key) {
    case "7d": return { from: new Date(today - 6 * DAY), to: tomorrow, label: "Сүүлийн 7 хоног" };
    case "month": return { from: new Date(today.getFullYear(), today.getMonth(), 1), to: tomorrow, label: "Энэ сар" };
    case "year": return { from: new Date(today.getFullYear(), 0, 1), to: tomorrow, label: "Энэ жил" };
    case "custom": {
      const f = dashRange.from ? new Date(dashRange.from + "T00:00") : new Date(today - 29 * DAY);
      const t = dashRange.to ? new Date(new Date(dashRange.to + "T00:00").getTime() + DAY) : tomorrow;
      return t > f ? { from: f, to: t, label: `${isoDay(f)} — ${isoDay(new Date(t - DAY))}` } : { from: t, to: new Date(f.getTime() + DAY), label: "Огноо буруу" };
    }
    default: return { from: new Date(today - 29 * DAY), to: tomorrow, label: "Сүүлийн 30 хоног" };
  }
}

function renderDashboard(){
  const { from, to, label } = rangeBounds();
  const inRange = o => { const d = new Date(o.createdAt); return d >= from && d < to; };
  const live = orders.filter(o => o.status !== "cancelled");
  const earned = live.filter(o => o.status === "paid" || o.status === "shipped");   // money actually received
  const sum = list => list.reduce((a, o) => a + o.total, 0);
  const waiting = orders.filter(o => o.status === "new");
  const toShip = orders.filter(o => o.status === "paid");
  const rangeEarned = earned.filter(inRange), rangeLive = live.filter(inRange);

  // Revenue buckets: per day for up to ~2 months, per month beyond that
  const spanDays = Math.round((to - from) / DAY);
  const monthly = spanDays > 62;
  const buckets = {};
  rangeEarned.forEach(o => { const k = monthly ? monthKey(o.createdAt) : dayKey(o.createdAt); buckets[k] = (buckets[k] || 0) + o.total; });
  const points = [];
  if (monthly) {
    for (let d = new Date(from.getFullYear(), from.getMonth(), 1); d < to; d = new Date(d.getFullYear(), d.getMonth() + 1, 1))
      points.push({ label: `${d.getMonth() + 1}/${String(d.getFullYear()).slice(2)}`, tip: `${d.getFullYear()} ${MONTHS[d.getMonth()]}`, v: buckets[monthKey(d)] || 0 });
  } else {
    for (let d = new Date(from); d < to; d = new Date(d.getTime() + DAY))
      points.push({ label: shortDate(d), tip: isoDay(d), v: buckets[dayKey(d)] || 0 });
  }

  // Low stock (tracked sizes with 3 or fewer left)
  const low = [];
  products.forEach(p => sizesOf(p).forEach(sz => { const n = p.stock[sz]; if (Number.isInteger(n) && n <= 3) low.push({ p, sz, n }); }));
  low.sort((a, b) => a.n - b.n);

  // Best sellers by quantity in the range
  const sold = {};
  rangeLive.forEach(o => o.items.forEach(i => {
    const r = sold[i.id] || (sold[i.id] = { id: i.id, name: i.name, qty: 0, sum: 0 });
    r.qty += i.qty; r.sum += i.qty * i.price;
  }));
  const top = Object.values(sold).sort((a, b) => b.qty - a.qty).slice(0, 5);
  const topMax = Math.max(1, ...top.map(t => t.qty));
  const thumb = id => { const p = products.find(x => x.id === id); return p ? art(p) : ""; };
  const avg = rangeEarned.length ? Math.round(sum(rangeEarned) / rangeEarned.length) : 0;
  const R = (k, t) => `<button data-r="${k}" class="${dashRange.key === k ? "on" : ""}">${t}</button>`;

  $app.innerHTML = `<div class="dash">
    <div class="ranges">
      ${R("7d", "7 хоног")}${R("30d", "30 хоног")}${R("month", "Энэ сар")}${R("year", "Энэ жил")}
      <span class="custom${dashRange.key === "custom" ? " on" : ""}">
        <input type="date" id="rf" value="${esc(dashRange.from || isoDay(from))}" max="${isoDay(new Date())}">
        <span>—</span>
        <input type="date" id="rt" value="${esc(dashRange.to || isoDay(new Date(to - DAY)))}" max="${isoDay(new Date())}">
      </span>
    </div>
    <div class="tiles">
      <button class="tile" data-go="orders"><span>Орлого · ${esc(label)}</span><b>${fmt(sum(rangeEarned))}</b><small>${rangeEarned.length} төлөгдсөн · дундаж ${fmt(avg)}</small></button>
      <button class="tile" data-go="orders"><span>Захиалга · ${esc(label)}</span><b>${rangeLive.length}</b><small>Нийт ${live.length} захиалга</small></button>
      <button class="tile${waiting.length ? " alert" : ""}" data-go="orders"><span>Төлбөр хүлээгдэж буй</span><b>${waiting.length}</b><small>${fmt(sum(waiting))}</small></button>
      <button class="tile${toShip.length ? " alert" : ""}" data-go="orders"><span>Илгээх ёстой</span><b>${toShip.length}</b><small>Төлбөр орсон, хүргээгүй</small></button>
    </div>

    <div class="panel">
      <h2>Орлого · ${esc(label)} <small>${monthly ? "сараар" : "өдрөөр"} · нийт ${fmt(sum(rangeEarned))}</small></h2>
      <div class="chart" id="chart"></div>
    </div>

    <div class="cols">
      <div class="panel">
        <h2>Их зарагдсан бараа <small>${esc(label)}</small></h2>
        ${top.length ? top.map(t => `<div class="li"><div class="th">${thumb(t.id)}</div>
          <div class="nm">${esc(t.name)}<div class="bar" style="width:${Math.max(4, t.qty / topMax * 100)}%"></div></div>
          <div class="num">${t.qty} ш</div></div>`).join("") : `<div class="empty" style="padding:24px 0">Борлуулалт алга</div>`}
      </div>
      <div class="panel">
        <h2>Үлдэгдэл багассан <small>3 ба түүнээс доош</small></h2>
        ${low.length ? low.slice(0, 8).map(l => `<div class="li click" data-edit="${l.p.id}"><div class="th">${art(l.p)}</div>
          <div class="nm">${esc(l.p.name)} <span style="color:var(--muted)">(${esc(l.sz)})</span></div>
          <div class="num${l.n === 0 ? " red" : ""}">${l.n === 0 ? "Дууссан" : l.n + " ш"}</div></div>`).join("") : `<div class="empty" style="padding:24px 0">Бүх бараа хангалттай</div>`}
      </div>
    </div>

    <div class="panel" style="margin-top:20px">
      <h2>Сүүлийн захиалгууд</h2>
      ${orders.length ? orders.slice(0, 6).map(o => `<div class="li click" data-go="orders">
        <div class="num" style="width:44px">#${o.id}</div>
        <div class="nm">${esc(o.name)} <span style="color:var(--muted)">· ${new Date(o.createdAt).toLocaleDateString("mn-MN")}</span></div>
        <span class="pill ${o.status}">${STATUS[o.status]}</span>
        <div class="num" style="min-width:90px;text-align:right">${fmt(o.total)}</div></div>`).join("") : `<div class="empty" style="padding:24px 0">Захиалга алга</div>`}
    </div>
  </div>`;

  drawRevenueChart(document.getElementById("chart"), points, label);
  $app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { dashRange = { key: b.dataset.r, from: "", to: "" }; renderDashboard(); });
  const setCustom = () => { dashRange = { key: "custom", from: document.getElementById("rf").value, to: document.getElementById("rt").value }; renderDashboard(); };
  document.getElementById("rf").onchange = setCustom;
  document.getElementById("rt").onchange = setCustom;
  $app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { tab = b.dataset.go; render(); });
  $app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEditor(products.find(p => p.id == b.dataset.edit)));
}

// Single-series area chart with a crosshair tooltip; no library needed.
// points: [{ label (axis), tip (tooltip), v }]
function drawRevenueChart(el, points, title){
  // Drawn at the real pixel width so axis text keeps its size on phones.
  const W = Math.max(300, Math.round(el.clientWidth) || 900), H = W < 500 ? 180 : 240, L = 56, R = 8, T = 10, B = 24;
  const n = points.length, last = n - 1;
  const raw = Math.max(0, ...points.map(d => d.v));
  const step = raw > 0 ? Math.pow(10, Math.floor(Math.log10(raw))) : 1;
  const max = raw > 0 ? Math.ceil(raw / step) * step : 100000;
  const x = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / last;
  const y = v => T + (1 - v / max) * (H - T - B);
  const short = v => v >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0) + "сая" : v >= 1e3 ? Math.round(v / 1e3) + "мян" : String(v);
  const pts = points.map((d, i) => `${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(" ");
  const grid = [0, .5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#e6e6e6"/>
    <text x="${L - 8}" y="${y(max * f) + 3}" text-anchor="end" font-size="9" fill="#6b6b6b">${short(max * f)}</text>`).join("");
  const ticks = [...new Set([0, Math.round(last / 2), last])];
  const xl = ticks.map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${ticks.length > 1 && i === 0 ? "start" : ticks.length > 1 && i === last ? "end" : "middle"}" font-size="9" fill="#6b6b6b">${esc(points[i].label)}</text>`).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Орлого: ${esc(title)}">
      ${grid}${xl}
      ${n > 1 ? `<polygon points="${x(0)},${y(0)} ${pts} ${x(last)},${y(0)}" fill="#c51811" fill-opacity=".08"/>
      <polyline points="${pts}" fill="none" stroke="#c51811" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
      : `<circle cx="${x(0)}" cy="${y(points[0].v)}" r="4" fill="#c51811"/>`}
      <line id="cx" y1="${T}" y2="${H - B}" stroke="#000" stroke-width="1" visibility="hidden"/>
      <circle id="cd" r="4.5" fill="#c51811" stroke="#fff" stroke-width="2" visibility="hidden"/>
      <rect id="hit" x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>
    </svg>
    <div class="tip" id="tip"></div>
    <details><summary>Хүснэгтээр харах</summary><table>${points.filter(d => d.v).map(d => `<tr><td>${esc(d.tip)}</td><td style="text-align:right">${fmt(d.v)}</td></tr>`).join("") || "<tr><td>Орлого алга</td></tr>"}</table></details>`;
  const svg = el.querySelector("svg"), tip = el.querySelector("#tip"), cx = el.querySelector("#cx"), cd = el.querySelector("#cd");
  const move = e => {
    const r = svg.getBoundingClientRect();
    const px = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * W;
    const i = n === 1 ? 0 : Math.max(0, Math.min(last, Math.round((px - L) / (W - L - R) * last)));
    const d = points[i];
    cx.setAttribute("x1", x(i)); cx.setAttribute("x2", x(i)); cd.setAttribute("cx", x(i)); cd.setAttribute("cy", y(d.v));
    [cx, cd].forEach(n => n.setAttribute("visibility", "visible"));
    tip.style.display = "block";
    tip.style.left = (x(i) / W * r.width) + "px"; tip.style.top = (y(d.v) / H * r.height) + "px";
    tip.innerHTML = `${esc(d.tip)} · <b>${fmt(d.v)}</b>`;
  };
  const hide = () => { tip.style.display = "none"; [cx, cd].forEach(n => n.setAttribute("visibility", "hidden")); };
  const hit = el.querySelector("#hit");
  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("mouseleave", hide); hit.addEventListener("touchend", hide);
}

/* ---------- Tabs ---------- */
function render(){
  const fresh = orders.filter(o => o.status === "new").length;
  document.getElementById("badge").innerHTML = fresh ? `<b>${fresh}</b>` : "";
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ({ dashboard: renderDashboard, products: renderProducts, orders: renderOrders, customers: renderCustomers, coupons: renderCoupons, settings: renderSettings })[tab]();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });

async function start(){
  try { [products, orders, coupons] = await Promise.all([api("products"), api("orders"), api("coupons")]); }
  catch (e) { if (e.status === 401) return showLogin(); return toast(e.message, true); }
  document.getElementById("login").hidden = true;
  document.getElementById("panel").hidden = false;
  document.getElementById("logout").hidden = false;
  render();
}
start();
</script>
