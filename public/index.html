<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORSEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --fg:#000000; --muted:#6b6b6b; --red:#c51811; --line:#e6e6e6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg)}
  body{font-family:"Unbounded",Arial,sans-serif;font-size:11px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* Header */
  header{position:sticky;top:0;z-index:10;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px}
  .lang{justify-self:start;display:flex;gap:4px;align-items:center}
  .lang button{width:22px;height:22px;display:grid;place-items:center;font-size:8px;font-weight:800;border:1.5px solid var(--fg)}
  .lang button.on{background:var(--fg);color:var(--bg)}
  .logo{display:block;width:64px;height:64px;object-fit:contain}
  .cart-btn{justify-self:end;position:relative;width:42px;height:28px}
  .cart-btn img{width:100%;height:100%;object-fit:contain;display:block}
  .cart-btn span{position:absolute;top:-6px;right:-7px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;display:grid;place-items:center;font-size:8px;font-weight:800;background:var(--red);color:#fff}

  main{flex:1;padding:8px 16px 40px}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px 10px}
  @media (max-width:1100px){.grid{grid-template-columns:repeat(8,1fr)}}
  @media (max-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
  .item{position:relative;aspect-ratio:1/1;display:grid;place-items:center}
  .item svg,.item img{width:80%;height:80%;object-fit:contain;transition:transform .25s ease}
  .item:hover svg,.item:hover img{transform:scale(1.08)}
  .item.sold svg,.item.sold img{filter:blur(3px);opacity:.85}
  .item.sold::after{content:"SOLD OUT";position:absolute;font-size:8px;font-weight:800;color:var(--red);letter-spacing:.02em;white-space:nowrap}

  /* Product */
  .product{max-width:560px;margin:24px auto 0}
  .product .img{width:min(320px,80vw);aspect-ratio:1/1;margin:0 auto 36px;display:grid;place-items:center}
  .product .img svg,.product .img img{width:100%;height:100%;object-fit:contain}
  .product h1{font-size:13px;font-weight:600;margin-bottom:22px}
  .product p{font-size:10px;margin-bottom:12px;max-width:440px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 10px}
  .size{min-width:34px;height:28px;padding:0 8px;border:1.5px solid var(--fg);font-size:9px;font-weight:600}
  .size.on{background:var(--fg);color:var(--bg)}
  .price{font-weight:800;font-size:12px}
  .add{margin-top:10px;width:100%;height:42px;background:var(--fg);color:var(--bg);font-size:10px;font-weight:800;letter-spacing:.06em}
  .add:disabled{background:var(--line);color:var(--red);cursor:default}
  .back{display:inline-block;margin-bottom:12px;font-size:9px;color:var(--muted)}

  /* Cart */
  .cart{max-width:560px;margin:24px auto 0}
  .cart h1,.about h1{font-size:13px;font-weight:600;margin-bottom:24px;text-align:center}
  .line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .line svg,.line img{width:56px;height:56px;object-fit:contain;display:block}
  .form{display:grid;gap:8px;margin-top:8px}
  .form input,.form textarea{font:inherit;font-size:10px;padding:10px;border:1.5px solid var(--fg);background:var(--bg);color:var(--fg);resize:vertical}
  .line .meta{font-size:10px}
  .line .meta small{display:block;color:var(--muted);font-size:9px}
  .qty{display:flex;gap:8px;align-items:center;font-weight:600}
  .qty button{width:20px;height:20px;border:1.5px solid var(--fg);font-size:10px;line-height:1}
  .coupon{display:flex;gap:8px;margin-top:16px}
  .coupon input{flex:1;font:inherit;font-size:10px;padding:10px;border:1.5px solid var(--fg);background:var(--bg);color:var(--fg);text-transform:uppercase}
  .coupon button{padding:0 14px;border:1.5px solid var(--fg);font-size:9px;font-weight:800}
  .disc{display:flex;justify-content:space-between;color:var(--red);font-size:10px;margin-top:12px}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:12px;margin:20px 0 6px}
  .empty{text-align:center;color:var(--muted);padding:60px 0}

  /* About */
  .about{max-width:520px;margin:24px auto 0;font-size:10px}
  .about p{margin-bottom:14px}

  footer{text-align:center;padding:24px 16px 28px;font-size:10px;font-weight:600}
  footer a{border-bottom:1px solid transparent}
  footer a:hover{border-color:var(--fg)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;font-size:9px;font-weight:600;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div class="lang">
    <button data-lang="mn">MN</button>
    <button data-lang="en">EN</button>
  </div>
  <a href="#/" aria-label="CORSEL">
    <img class="logo" src="logo.png" alt="Logo">
  </a>
  <a href="#/cart" class="cart-btn" aria-label="Cart">
    <img src="cart.webp" alt="">
    <span id="count">0</span>
  </a>
</header>

<main id="app"></main>

<footer><a href="#/about" id="aboutLink"></a></footer>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>

/* ---------- i18n ---------- */
const T = {
  mn:{about:"Бидний тухай",add:"САГСАНД НЭМЭХ",sold:"ДУУССАН",cart:"Сагс",empty:"Таны сагс хоосон байна.",total:"Нийт",checkout:"ЗАХИАЛАХ",back:"← Буцах",added:"Сагсанд нэмэгдлээ",size:"Хэмжээ",
      desc:"Нүүдэлчдийн тамга, хээ угалзаас сэдэвлэсэн хэвлэлтэй. Хэвлэл бүр нь газар, тэнгэр, хүний хоорондын холбоог илэрхийлэх тэмдэг юм.",
      note:"(Улаанбаатар хотод гараар хийв)",
      aboutText:["CORSEL бол Улаанбаатарт төвтэй хувцасны брэнд. Бид монгол уламжлалт хээ, тамга тэмдгийг орчин үеийн гудамжны хувцастай хослуулдаг.","Цуглуулга бүр хязгаарлагдмал тоогоор үйлдвэрлэгддэг бөгөөд дахин гаргахгүй.","Холбоо барих: hello@corsel.mn"],
      ordered:"Захиалга хүлээн авлаа",fName:"Нэр",fPhone:"Утас",fAddress:"Хүргэлтийн хаяг",cCode:"Купон код",cApply:"Ашиглах",cDisc:"Хөнгөлөлт",cOk:"Купон ашиглагдлаа",cBad:"Купон код буруу байна",none:"Одоогоор бараа алга.",error:"Ачаалж чадсангүй. Дахин оролдоно уу."},
  en:{about:"About us",add:"ADD TO CART",sold:"SOLD OUT",cart:"Cart",empty:"Your cart is empty.",total:"Total",checkout:"CHECKOUT",back:"← Back",added:"Added to cart",size:"Size",
      desc:"Printed with motifs drawn from nomadic tamga marks and ornament. Every print is a symbol of the bond between land, sky and people.",
      note:"(Made by hand in Ulaanbaatar)",
      aboutText:["CORSEL is a clothing label based in Ulaanbaatar, pairing traditional Mongolian ornament and tamga marks with contemporary streetwear.","Each collection is produced in limited numbers and never restocked.","Contact: hello@corsel.mn"],
      ordered:"Order received",fName:"Name",fPhone:"Phone",fAddress:"Delivery address",cCode:"Coupon code",cApply:"Apply",cDisc:"Discount",cOk:"Coupon applied",cBad:"Invalid coupon code",none:"No products yet.",error:"Could not load. Please try again."},
};

/* ---------- State ---------- */
let PRODUCTS = [];
let coupon = null;   // { code, percent } verified by the server
let lang = store.get("corsel-lang", "mn");
let cart = store.get("corsel-cart", []);

const $app = document.getElementById("app");
const name = p => esc(lang === "en" && p.nameEn ? p.nameEn : p.name);
const desc = p => esc(p.description) || T[lang].desc;
const byId = id => PRODUCTS.find(p => p.id === id);

function saveCart(){ store.set("corsel-cart", cart); document.getElementById("count").textContent = cart.reduce((a,c)=>a+c.q,0); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2000); }

/* ---------- Views ---------- */
function viewHome(){
  $app.innerHTML = PRODUCTS.length ? `<div class="grid">${PRODUCTS.map(p =>
    `<a class="item${p.sold?" sold":""}" href="#/product/${p.id}" title="${name(p)}">${art(p)}</a>`).join("")}</div>`
    : `<div class="empty">${T[lang].none}</div>`;
}

function viewProduct(id){
  const p = byId(+id);
  if (!p) return viewHome();
  const sizes = p.sizes.length ? p.sizes : ["OS"];
  let sel = sizes[0];
  $app.innerHTML = `<div class="product">
    <a class="back" href="#/">${T[lang].back}</a>
    <div class="img">${art(p)}</div>
    <h1>${name(p)}</h1>
    <p style="white-space:pre-line">${desc(p)}</p>
    <div class="row">${sizes.map(s=>`<button class="size${s===sel?" on":""}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <div class="price">${fmt(p.price)}</div>
    <button class="add" ${p.sold?"disabled":""}>${p.sold?T[lang].sold:T[lang].add}</button>
  </div>`;
  $app.querySelectorAll(".size").forEach(b => b.onclick = () => {
    sel = b.dataset.s; $app.querySelectorAll(".size").forEach(x=>x.classList.toggle("on", x===b));
  });
  $app.querySelector(".add").onclick = () => {
    const ex = cart.find(c => c.id===p.id && c.s===sel);
    ex ? ex.q++ : cart.push({ id:p.id, s:sel, q:1 });
    saveCart(); toast(T[lang].added);
  };
}

function viewCart(){
  const t = T[lang];
  if (!cart.length){ $app.innerHTML = `<div class="cart"><h1>${t.cart}</h1><div class="empty">${t.empty}</div></div>`; return; }
  const subtotal = cart.reduce((a,c)=>a + byId(c.id).price*c.q, 0);
  const discount = coupon ? Math.round(subtotal * coupon.percent / 100) : 0;
  const total = subtotal - discount;
  $app.innerHTML = `<div class="cart"><h1>${t.cart}</h1>
    ${cart.map((c,i)=>{ const p=byId(c.id); return `<div class="line">
      <a href="#/product/${p.id}">${art(p)}</a>
      <div class="meta">${name(p)}<small>${t.size}: ${esc(c.s)} · ${fmt(p.price)}</small></div>
      <div class="qty"><button data-i="${i}" data-d="-1">−</button>${c.q}<button data-i="${i}" data-d="1">+</button></div>
    </div>`; }).join("")}
    <form id="coupon" class="coupon">
      <input name="code" placeholder="${t.cCode}" value="${esc(coupon?.code)}" autocomplete="off" ${coupon?"readonly":""}>
      <button>${coupon ? "✕" : t.cApply}</button>
    </form>
    ${coupon ? `<div class="disc"><span>${t.cDisc} (${esc(coupon.code)} −${coupon.percent}%)</span><span>−${fmt(discount)}</span></div>` : ""}
    <div class="total"><span>${t.total}</span><span>${fmt(total)}</span></div>
    <form id="checkout" class="form">
      <input name="name" placeholder="${t.fName}" required>
      <input name="phone" placeholder="${t.fPhone}" required pattern="[0-9+ ]{8,}">
      <textarea name="address" placeholder="${t.fAddress}" rows="2" required></textarea>
      <button class="add">${t.checkout}</button>
    </form></div>`;
  $app.querySelectorAll(".qty button").forEach(b => b.onclick = () => {
    const c = cart[b.dataset.i]; c.q += +b.dataset.d;
    if (c.q <= 0) cart.splice(b.dataset.i, 1);
    saveCart(); viewCart();
  });
  document.getElementById("coupon").onsubmit = async e => {
    e.preventDefault();
    if (coupon) { coupon = null; return viewCart(); }
    const code = e.target.code.value.trim();
    if (!code) return;
    try { coupon = await api("coupons?code=" + encodeURIComponent(code)); viewCart(); toast(t.cOk); }
    catch { toast(t.cBad); }
  };
  document.getElementById("checkout").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true;
    const f = new FormData(e.target);
    try {
      await api("orders", { method: "POST", body: {
        name: f.get("name"), phone: f.get("phone"), address: f.get("address"), coupon: coupon?.code,
        items: cart.map(c => ({ id: c.id, size: c.s, qty: c.q })),
      }});
      cart = []; coupon = null; saveCart(); viewCart(); toast(t.ordered);
    } catch (err) { toast(err.message); btn.disabled = false; }
  };
}

function viewAbout(){
  $app.innerHTML = `<div class="about"><h1>${T[lang].about}</h1>${T[lang].aboutText.map(x=>`<p>${x}</p>`).join("")}</div>`;
}

/* ---------- Router ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/, "").split("/");
  document.documentElement.lang = lang;
  document.getElementById("aboutLink").textContent = T[lang].about;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang===lang));
  if (h[0]==="product") viewProduct(h[1]);
  else if (h[0]==="cart") viewCart();
  else if (h[0]==="about") viewAbout();
  else viewHome();
  window.scrollTo(0,0);
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("corsel-lang", lang); route(); });
window.addEventListener("hashchange", route);

(async () => {
  try { PRODUCTS = await api("products"); }
  catch { $app.innerHTML = `<div class="empty">${T[lang].error}</div>`; return; }
  cart = cart.filter(c => byId(c.id));   // drop items deleted by the admin
  saveCart(); route();
})();
</script>
</body>
</html>
